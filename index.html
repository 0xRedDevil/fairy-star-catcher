<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fairy Star Catcher 🧚✨</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a0b2e 0%, #3b1458 50%, #1f0d3d 100%);
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 800px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, #2c1654 0%, #130726 100%);
        }
        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(19, 7, 38, 0.85);
            backdrop-filter: blur(5px);
            z-index: 10;
            padding: 20px;
            text-align: center;
            transition: opacity 0.3s ease;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 2.4rem;
            margin: 0 0 10px 0;
            color: #ffccff;
            text-shadow: 0 0 15px #ff77ff, 0 0 30px #ff00ff;
        }
        p {
            font-size: 1.1rem;
            margin: 5px 0 20px 0;
            color: #d1c4e9;
        }
        .btn {
            background: linear-gradient(to bottom, #ff77ff, #aa00aa);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 0, 255, 0.4);
            transition: transform 0.1s, background 0.2s;
            font-family: inherit;
            margin: 10px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .leaderboard-box {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 119, 255, 0.3);
            border-radius: 12px;
            padding: 15px;
            width: 85%;
            max-width: 320px;
            margin-bottom: 20px;
        }
        .leaderboard-box h3 {
            margin: 0 0 10px 0;
            color: #ffd700;
            font-size: 1.2rem;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }
        .lb-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }
        .lb-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
            font-size: 1rem;
        }
        .lb-item:last-child {
            border-bottom: none;
        }
        .lb-rank {
            font-weight: bold;
            color: #ff99ff;
            width: 25px;
        }
        .lb-name {
            flex-grow: 1;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 10px;
        }
        .lb-score {
            font-weight: bold;
            color: #00ffff;
        }
        .input-group {
            margin: 15px 0;
        }
        input[type="text"] {
            padding: 12px 18px;
            font-size: 1.2rem;
            border-radius: 25px;
            border: 2px solid #ff77ff;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            text-align: center;
            width: 80%;
            max-width: 260px;
            outline: none;
            font-family: inherit;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            pointer-events: none;
            font-size: 1.4rem;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .hud-pill {
            background: rgba(50, 20, 80, 0.6);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 119, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- HUD during gameplay -->
        <div id="hud" class="hidden">
            <div class="hud-pill">✨ <span id="score-display">0</span></div>
            <div class="hud-pill">💖 <span id="lives-display">❤️❤️❤️</span></div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="ui-screen">
            <h1>Fairy Star Catcher</h1>
            <p>Guide the magical fairy to catch sparkling stars and hearts while avoiding stormy clouds!</p>

            <div class="leaderboard-box">
                <h3>🏆 Top 5 Stars</h3>
                <ul id="start-lb" class="lb-list">
                    <!-- Populated by JS -->
                </ul>
            </div>

            <button class="btn" id="start-btn">Play Game! ✨</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="ui-screen hidden">
            <h1>Game Over!</h1>
            <p>You collected <span id="final-score" style="color: #ffd700; font-weight: bold;">0</span> stars!</p>

            <div id="new-high-score-section" class="input-group hidden">
                <p style="color: #00ffff; margin-bottom: 8px;">🎉 New Top 5 Score! Enter Your Name:</p>
                <input type="text" id="player-name" maxlength="12" placeholder="Your Name">
                <br>
                <button class="btn" id="save-score-btn" style="padding: 10px 24px; font-size: 1.1rem; margin-top: 10px;">Save Score</button>
            </div>

            <div class="leaderboard-box" id="gameover-lb-container">
                <h3>🏆 Leaderboard</h3>
                <ul id="gameover-lb" class="lb-list">
                    <!-- Populated by JS -->
                </ul>
            </div>

            <button class="btn" id="restart-btn">Play Again 🌟</button>
        </div>

        <!-- Canvas Game Area -->
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Resize canvas to match container
        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio setup (Web Audio API for zero external file dependencies)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'star') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now); // D5
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'heart') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.08);
                    osc.frequency.setValueAtTime(659.25, now + 0.16);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'hurt') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(60, now + 0.25);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }
            } catch (e) {
                // Ignore audio context autoplay blocks before interaction
            }
        }

        // Leaderboard Management
        function getLeaderboard() {
            try {
                const data = localStorage.getItem('fairy_star_leaderboard');
                if (data) return JSON.parse(data);
            } catch (e) {}
            // Default placeholder scores
            return [
                { name: "Sparkle", score: 25 },
                { name: "Luna", score: 18 },
                { name: "Stella", score: 12 },
                { name: "Aria", score: 8 },
                { name: "Nova", score: 5 }
            ];
        }

        function saveLeaderboard(lb) {
            try {
                localStorage.setItem('fairy_star_leaderboard', JSON.stringify(lb));
            } catch (e) {}
        }

        function renderLeaderboard(elementId) {
            const listEl = document.getElementById(elementId);
            const lb = getLeaderboard();
            listEl.innerHTML = '';
            lb.forEach((entry, index) => {
                const li = document.createElement('li');
                li.className = 'lb-item';
                li.innerHTML = `
                    <span class="lb-rank">#${index + 1}</span>
                    <span class="lb-name">${escapeHtml(entry.name)}</span>
                    <span class="lb-score">${entry.score}</span>
                `;
                listEl.appendChild(li);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Game State Variables
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let lives = 3;
        let gameTime = 0;
        let items = [];
        let particles = [];

        const fairy = {
            x: canvas.width / 2,
            y: canvas.height - 120,
            radius: 28,
            targetX: canvas.width / 2,
            targetY: canvas.height - 120,
            wingAngle: 0
        };

        // Input controls (Touch & Mouse)
        let isPointerDown = false;

        function updatePointer(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            fairy.targetX = clientX - rect.left;
            fairy.targetY = clientY - rect.top;
        }

        window.addEventListener('pointerdown', (e) => {
            if (gameState === 'PLAYING') {
                isPointerDown = true;
                updatePointer(e);
            }
        });
        window.addEventListener('pointermove', (e) => {
            if (gameState === 'PLAYING' && isPointerDown) {
                updatePointer(e);
            }
        });
        window.addEventListener('pointerup', () => { isPointerDown = false; });

        // Item Spawning
        function spawnItem() {
            const rand = Math.random();
            let type = 'star';
            if (rand < 0.15) type = 'heart';
            else if (rand < 0.45) type = 'cloud';

            const size = type === 'cloud' ? 36 : 24;
            items.push({
                x: Math.random() * (canvas.width - 60) + 30,
                y: -50,
                vy: (Math.random() * 1.5 + 2) + (score * 0.03),
                type: type,
                size: size,
                rotation: Math.random() * Math.PI,
                vRot: (Math.random() - 0.5) * 0.05
            });
        }

        // Particle effects
        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    alpha: 1,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        // Start Game
        function startGame() {
            initAudio();
            score = 0;
            lives = 3;
            gameTime = 0;
            items = [];
            particles = [];
            fairy.x = canvas.width / 2;
            fairy.y = canvas.height - 120;
            fairy.targetX = fairy.x;
            fairy.targetY = fairy.y;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('score-display').innerText = score;
            document.getElementById('lives-display').innerText = '❤️❤️❤️';

            gameState = 'PLAYING';
        }

        // Game Over Handler
        function triggerGameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('final-score').innerText = score;

            // Check if score qualifies for Top 5
            const lb = getLeaderboard();
            const lowestScore = lb.length < 5 ? 0 : lb[lb.length - 1].score;

            const hsSection = document.getElementById('new-high-score-section');
            if (score > lowestScore || lb.length < 5) {
                hsSection.classList.remove('hidden');
                document.getElementById('player-name').value = '';
            } else {
                hsSection.classList.add('hidden');
            }

            renderLeaderboard('gameover-lb');
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        // Main Game Loop
        let spawnTimer = 0;
        function update() {
            if (gameState !== 'PLAYING') return;

            gameTime++;
            spawnTimer++;

            // Smooth fairy movement towards touch/mouse position
            fairy.x += (fairy.targetX - fairy.x) * 0.15;
            fairy.y += (fairy.targetY - fairy.y) * 0.15;

            // Keep fairy inside canvas bounds
            const margin = 30;
            fairy.x = Math.max(margin, Math.min(canvas.width - margin, fairy.x));
            fairy.y = Math.max(margin, Math.min(canvas.height - margin, fairy.y));

            fairy.wingAngle += 0.2;

            // Spawn items periodically
            let spawnInterval = Math.max(25, 60 - Math.floor(score / 3));
            if (spawnTimer > spawnInterval) {
                spawnItem();
                spawnTimer = 0;
            }

            // Update items
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.vy;
                item.rotation += item.vRot;

                // Collision detection with fairy
                let dx = item.x - fairy.x;
                let dy = item.y - fairy.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < fairy.radius + item.size * 0.6) {
                    // Collision!
                    if (item.type === 'star') {
                        score += 1;
                        playSound('star');
                        createParticles(item.x, item.y, '#ffff55');
                    } else if (item.type === 'heart') {
                        score += 3;
                        if (lives < 5) lives++;
                        playSound('heart');
                        createParticles(item.x, item.y, '#ff5599');
                    } else if (item.type === 'cloud') {
                        lives -= 1;
                        playSound('hurt');
                        createParticles(item.x, item.y, '#88aacc');
                        document.getElementById('lives-display').innerText = '❤️'.repeat(Math.max(0, lives));
                        if (lives <= 0) {
                            triggerGameOver();
                        }
                    }
                    document.getElementById('score-display').innerText = score;
                    document.getElementById('lives-display').innerText = '❤️'.repeat(Math.max(0, lives));
                    items.splice(i, 1);
                    continue;
                }

                // Remove off-screen items
                if (item.y > canvas.height + 50) {
                    items.splice(i, 1);
                }
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        // Rendering
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw magical background stars/sparkles
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            for (let i = 0; i < 30; i++) {
                let px = (i * 73 + gameTime * 0.2) % canvas.width;
                let py = (i * 137 + gameTime * 0.5) % canvas.height;
                ctx.fillRect(px, py, 2, 2);
            }

            // Draw Items
            items.forEach(item => {
                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.rotate(item.rotation);

                if (item.type === 'star') {
                    drawStar(ctx, 0, 0, 5, item.size, item.size / 2, '#ffd700', '#ffea75');
                } else if (item.type === 'heart') {
                    drawHeart(ctx, 0, 0, item.size * 0.8, '#ff3366');
                } else if (item.type === 'cloud') {
                    drawCloud(ctx, 0, 0, item.size);
                }
                ctx.restore();
            });

            // Draw Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Fairy
            if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
                ctx.save();
                ctx.translate(fairy.x, fairy.y);

                // Glow aura
                let gradient = ctx.createRadialGradient(0, 0, 5, 0, 0, fairy.radius * 1.5);
                gradient.addColorStop(0, 'rgba(255, 150, 255, 0.4)');
                gradient.addColorStop(1, 'rgba(255, 150, 255, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(0, 0, fairy.radius * 1.5, 0, Math.PI * 2);
                ctx.fill();

                // Wings
                let wingFlap = Math.sin(fairy.wingAngle) * 12;
                ctx.fillStyle = 'rgba(200, 240, 255, 0.7)';
                ctx.beginPath();
                ctx.ellipse(-14, -4, 16, 8 + wingFlap * 0.3, -Math.PI / 6, 0, Math.PI * 2);
                ctx.ellipse(14, -4, 16, 8 + wingFlap * 0.3, Math.PI / 6, 0, Math.PI * 2);
                ctx.fill();

                // Dress / Body
                ctx.fillStyle = '#ff77ff';
                ctx.beginPath();
                ctx.moveTo(0, -14);
                ctx.lineTo(-14, 16);
                ctx.lineTo(14, 16);
                ctx.closePath();
                ctx.fill();

                // Head
                ctx.fillStyle = '#ffdfcc';
                ctx.beginPath();
                ctx.arc(0, -16, 11, 0, Math.PI * 2);
                ctx.fill();

                // Hair
                ctx.fillStyle = '#9933ff';
                ctx.beginPath();
                ctx.arc(0, -18, 10, Math.PI, Math.PI * 2);
                ctx.fill();

                // Wand & Star
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(10, 5);
                ctx.lineTo(22, -8);
                ctx.stroke();
                drawStar(ctx, 22, -8, 5, 8, 4, '#ffff00', '#ffffff');

                ctx.restore();
            }
        }

        // Shape helper functions
        function drawStar(ctx, cx, outerRadius, innerRadius, spikes, color1, color2) {
            // simplified star drawer
            ctx.fillStyle = color1;
            ctx.beginPath();
            let rot = Math.PI / 2 * 3;
            let x = cx, y = 0;
            let step = Math.PI / spikes;

            ctx.moveTo(cx, 0 - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = 0 + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = 0 + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, 0 - outerRadius);
            ctx.closePath();
            ctx.fill();
        }

        function drawHeart(ctx, x, y, size, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            let r = size / 2;
            ctx.moveTo(x, y + r * 0.6);
            ctx.bezierCurveTo(x, y, x - size, y - size * 0.6, x - size, y - r * 0.2);
            ctx.bezierCurveTo(x - size, y + r * 0.8, x, y + size, x, y + size);
            ctx.bezierCurveTo(x, y + size, x + size, y + r * 0.8, x + size, y - r * 0.2);
            ctx.bezierCurveTo(x + size, y - size * 0.6, x, y, x, y + r * 0.6);
            ctx.fill();
        }

        function drawCloud(ctx, x, y, size) {
            ctx.fillStyle = '#b0c4de';
            ctx.beginPath();
            ctx.arc(x - size * 0.3, y, size * 0.4, 0, Math.PI * 2);
            ctx.arc(x + size * 0.3, y, size * 0.4, 0, Math.PI * 2);
            ctx.arc(x, y - size * 0.3, size * 0.45, 0, Math.PI * 2);
            ctx.fill();
        }

        // Loop Runner
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Event Listeners for UI Buttons
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        document.getElementById('save-score-btn').addEventListener('click', () => {
            const nameInput = document.getElementById('player-name');
            const name = nameInput.value.trim() || 'Fairy Player';

            let lb = getLeaderboard();
            lb.push({ name: name, score: score });
            lb.sort((a, b) => b.score - a.score);
            lb = lb.slice(0, 5); // Keep top 5

            saveLeaderboard(lb);
            document.getElementById('new-high-score-section').classList.add('hidden');
            renderLeaderboard('gameover-lb');
        });

        // Initialize start screen leaderboard
        renderLeaderboard('start-lb');
        requestAnimationFrame(loop);
    </script>
</body>
</html>
